services:

  hpe-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    container_name: hpe-mcp
    volumes:
      - ${SECRETS_DIR:-./hpe-secrets}:/run/secrets:ro
      - ${SECRETS_DIR:-./hpe-secrets}/../zscaler-full-chain.pem:/tmp/zscaler-chain.pem:ro
      - ${SECRETS_DIR:-./hpe-secrets}/../docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      # Classic Central rotates its refresh token on every use (see
      # platforms/classic_central/client.py). The main secrets mount above
      # is read-only by design for every other credential; this single
      # file gets its own read-write bind so the rotated token can persist
      # across restarts instead of going stale after one boot.
      - ${SECRETS_DIR:-./hpe-secrets}/classic_central_refresh_token:/run/secrets-rw/classic_central_refresh_token
    ports:
      - "8000:8000"
    environment:
      - ENABLE_CENTRAL_WRITE_TOOLS=${ENABLE_CENTRAL_WRITE_TOOLS:-false}
      - CLASSIC_CENTRAL_REFRESH_TOKEN_WRITE_PATH=/run/secrets-rw/classic_central_refresh_token
      - ENABLE_CLASSIC_CENTRAL_WRITE_TOOLS=${ENABLE_CLASSIC_CENTRAL_WRITE_TOOLS:-true}
      - ENABLE_CLEARPASS_WRITE_TOOLS=${ENABLE_CLEARPASS_WRITE_TOOLS:-false}
      - ENABLE_GREENLAKE_WRITE_TOOLS=${ENABLE_GREENLAKE_WRITE_TOOLS:-false}
      - ENABLE_AOS8_WRITE_TOOLS=${ENABLE_AOS8_WRITE_TOOLS:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()\" 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netops-backend
    ports:
      - "3001:3001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MCP_SERVER_URL=http://hpe-mcp:8000/mcp
      - FRONTEND_URL=http://localhost:3000
      - PORT=3001
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/zscaler.crt
    depends_on:
      hpe-mcp:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: netops-network
