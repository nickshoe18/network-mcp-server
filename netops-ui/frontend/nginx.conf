# Local entry point (published only on 127.0.0.1:3000). Full access: Assistant and Jarvis modes.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Netops-Remote "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Remote entry point (published only on 127.0.0.1:3100 and exposed to the tailnet with `tailscale serve`).
# Always marks requests as remote so the backend forces read-only Jarvis mode and checks the Tailscale identity.
server {
    listen 81;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Netops-Remote "1";
        proxy_buffering off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
